[project]
name = "pom-scout"
version = "0.1.0"
description = "Explore a web app (including click-only menus), write Page Object JSON, and account for every page it could not reach."
readme = "README.md"
license = "MIT"
authors = [{ name = "Taemin Kim" }]
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pom-scout = "pom_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pom_scout"]

[tool.pytest.ini_options]
markers = ["live: hits public demo sites over the network (optional in CI)"]
addopts = "-m 'not live'"
