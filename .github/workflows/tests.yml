name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run tests against the public demo sites"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  offline:
    name: offline (rules + local fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q

  live:
    name: live demo sites (optional)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-latest
    continue-on-error: true  # public sites change or go down; this job reports, it does not gate
    env:
      # Public test account printed on the saucedemo login page.
      SAUCE_USERNAME: standard_user
      SAUCE_PASSWORD: secret_sauce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m live
